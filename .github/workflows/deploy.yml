name: Test and deploy

# Every push to main runs the tests, builds the app and publishes it to
# GitHub Pages. If a phase-2 branch exists, its build is published alongside
# at /preview/ (the Preview workflow on that branch triggers this one).
# Pull requests run the tests and build only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Look for a preview branch
        id: preview
        if: github.event_name != 'pull_request'
        run: |
          if git ls-remote --exit-code --heads origin phase-2 > /dev/null; then
            echo "branch=phase-2" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.preview.outputs.branch != ''
        with:
          ref: ${{ steps.preview.outputs.branch }}
          path: preview-src
      - name: Build the preview into dist/preview
        if: steps.preview.outputs.branch != ''
        # a broken preview never blocks the main app
        continue-on-error: true
        working-directory: preview-src
        env:
          VITE_CHANNEL: preview
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/preview
          cp -r dist/. ../dist/preview/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
