name: Test and deploy

# Every push to main runs the tests, builds the app and publishes it to
# GitHub Pages. The newest phase-N branch with work not yet in main is built
# alongside at /preview/ (the Preview workflow on that branch triggers this one).
# Pull requests run the tests and build only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Look for a preview branch
        id: preview
        if: github.event_name != 'pull_request'
        run: |
          git fetch --quiet origin '+refs/heads/phase-*:refs/remotes/origin/phase-*' || true
          for b in $(git for-each-ref --format='%(refname:lstrip=3)' 'refs/remotes/origin/phase-*' | sort -V -r); do
            if [ "$(git rev-list --count origin/main..origin/$b)" -gt 0 ]; then
              echo "branch=$b" >> "$GITHUB_OUTPUT"
              echo "Preview: $b"
              break
            fi
          done
      - uses: actions/checkout@v4
        if: steps.preview.outputs.branch != ''
        with:
          ref: ${{ steps.preview.outputs.branch }}
          path: preview-src
      - name: Build the preview into dist/preview
        if: steps.preview.outputs.branch != ''
        # a broken preview never blocks the main app
        continue-on-error: true
        working-directory: preview-src
        env:
          VITE_CHANNEL: preview
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/preview
          cp -r dist/. ../dist/preview/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
